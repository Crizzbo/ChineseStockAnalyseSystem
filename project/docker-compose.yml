version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: stock_postgres
    environment:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - stock-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: stock_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - stock-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_backend
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://stockuser:stockpass123@postgres:5432/stock_analysis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-key-change-in-production
      - JWT_SECRET_KEY=your-jwt-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - stock-network
    volumes:
      - ./backend:/app
    command: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:5000 app:app

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_celery_worker
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://stockuser:stockpass123@postgres:5432/stock_analysis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - stock-network
    volumes:
      - ./backend:/app
    command: celery -A app.celery worker --loglevel=info

  # Celery Beat (定时任务调度器)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_celery_beat
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://stockuser:stockpass123@postgres:5432/stock_analysis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - stock-network
    volumes:
      - ./backend:/app
    command: celery -A app.celery beat --loglevel=info

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stock-network
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_WS_URL=http://localhost:5000

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: stock_nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - stock-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  stock-network:
    driver: bridge